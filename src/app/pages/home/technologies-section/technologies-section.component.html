<div class="w-full h-full bg-gray-900 flex flex-col p-3 space-y-10 md:p-16">

  <div class="w-full flex flex-col space-y-1 justify-center items-start">
    <app-sub-heading [subHeadingText]="'HOME.TECHNOLOGIES.SUBHEADING' | translate"></app-sub-heading>
    <app-heading [bgColor]="colors" [headingText]="'HOME.TECHNOLOGIES.HEADING' | translate"></app-heading>
  </div>

  <!-- Filtros por categoría -->
  <div class="w-full flex flex-wrap justify-center gap-3 mb-8">
    <button
      *ngFor="let category of categories"
      (click)="filterByCategory(category)"
      [class.bg-indigo-600]="selectedCategory === category"
      [class.text-white]="selectedCategory === category"
      [class.bg-gray-700]="selectedCategory !== category"
      [class.text-gray-300]="selectedCategory !== category"
      class="px-4 py-2 rounded-full text-sm font-medium hover:bg-indigo-500 hover:text-white transition-all duration-300 capitalize"
    >
      {{ getCategoryTranslationKey(category) | translate }}
    </button>
  </div>

  <div #techUsed [@staggerFade]="inView ? 'open' : 'close'"
    class="w-full h-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6 py-5 md:py-10">

    <div
      *ngFor="let tech of filteredTechnologies; trackBy: trackByTechnology"
      class="group eachStaggerComponent"
    >
      <div class="flex flex-col items-center justify-center p-4 bg-gray-800 rounded-xl hover:bg-gray-700 transform hover:-translate-y-2 hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl cursor-pointer">
        <!-- Icono -->
        <div class="mb-3 group-hover:scale-110 transition-transform duration-300">
          <app-icon [iconType]="tech.iconType" [iconSize]="sizeXXL" class="text-gray-400 group-hover:text-white"></app-icon>
        </div>

        <!-- Nombre de la tecnología -->
        <h3 class="text-sm font-medium text-gray-300 group-hover:text-white text-center mb-2">
          {{ tech.nombre }}
        </h3>

        <!-- Barra de proficiencia -->
        <div class="w-full bg-gray-600 rounded-full h-1.5 mb-1">
          <div
            class="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 rounded-full transition-all duration-500"
            [style.width.%]="tech.proficiency"
          ></div>
        </div>

        <!-- Porcentaje -->
        <span class="text-xs text-gray-400 group-hover:text-gray-300">
          {{ tech.proficiency }}%
        </span>

        <!-- Badge de categoría -->
        <span class="mt-2 px-2 py-1 text-xs rounded-full"
              [ngClass]="{
                'bg-blue-500/20 text-blue-300': tech.categoria === 'Frontend',
                'bg-green-500/20 text-green-300': tech.categoria === 'Backend',
                'bg-yellow-500/20 text-yellow-300': tech.categoria === 'Database',
                'bg-purple-500/20 text-purple-300': tech.categoria === 'Tools',
                'bg-orange-500/20 text-orange-300': tech.categoria === 'Cloud'
              }">
          {{ getCategoryTranslationKey(tech.categoria) | translate }}
        </span>

        <!-- Años de experiencia -->
        <span class="mt-1 text-xs text-gray-500">
          {{ tech.yearsExperience }} {{ 'HOME.TECHNOLOGIES.YEARS' | translate }}
        </span>
      </div>
    </div>

  </div>
</div>
